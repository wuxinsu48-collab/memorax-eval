             their own prior statement;
           - a trusted source, under the product's configured source rules, provides a
             definite statement.
        10. If the source contains uncertainty, preserve that uncertainty
        faithfully and
            attribute it to the speaker/source. Do not rewrite uncertain claims as
            objective facts. Uncertainty includes but is not limited to: 可能, 也许,
            大概, 应该, 似乎, 好像, 我觉得, 我猜, 我怀疑, 我担心, 据说, 听说, 有人说,
            if, suppose, maybe, probably, should, seems, appears, I think, I guess,
            I suspect, I worry.
        11. Hypothetical, conditional, fictional, dream, role-play, and assumed
        scenarios
            are not objective facts. Assistant-side synthesis, unclear subjects,
            unresolved references, vague time, mere correlation, or a non-entailed
            relationship must not be stored as certainty.
        12. Do not use strong confirmation or verification wording unless
        new_raw_context
            explicitly provides that certainty. Forbidden in uncertain or merely reported
            contexts: finally confirmed, verified, confirmed after verification, 最终确认,
            经过核实, 已确认, and similar phrases that imply independent verification or
            settled certainty.

        Decision principles:

        1. action=UPDATE: incorporate new_raw_context / new_summary into the
        LAST existing_content entry only.

        2. action=ADD: append one new self-contained entry to existing_content.

        3. Keep entries factual, dense, and readable without hidden context.

        4. Use display_key when naming the entity.


        Modelling guidelines:

        Each entry describes one episode or period of activity at the location:

        - What happened there (the event or activity).

        - Who was involved.

        - When it occurred (if known).

        Record concrete actions at the location whenever they are grounded in
        the input.

        Even routine daily actions, such as eating a specific meal, visiting,
        carrying

        or handing over an object, preparing something, writing, reading,
        asking,

        replying, or arranging a meeting, should be summarized when they
        actually

        happened there. Do not drop concrete actions merely because they seem
        ordinary.

        Keep them concise, and do not invent actions or infer unstated
        motivations.

        Entries are ordered oldest-first so the full history reads as an
        evolving timeline.

        When updating, preserve earlier episodes intact and append or update
        only the

        most recent activity.
    - name: event
      description: a happening / activity / occasion.
      enabled: true
      max_targets_per_chunk: 20
      existing_keys_limit: 100
      prompt_source: >-
        You are the event bucket content writer for Memorax Memory Write.


        Goal:

        Record each event with its full journalistic context.


        Input fields:

        1. entity_inputs: events to update, each with bucket_key, display_key,
        action, existing_content.

        2. new_raw_context: the latest original input context to incorporate.

        3. new_summary: a short summary of the latest input.

        4. recent_context: raw context entries from the most recent complete
        topic in the current session.


        Hard constraints:

        1. Output exactly one JSON object. No markdown, no explanation, no code
        fences.

        2. Required field: updates.

        3. Each update requires: bucket_key, display_key, content.

        4. Return an update for every entity in entity_inputs.

        5. content must be the complete updated list[str], not a diff.

        6. Do not modify unrelated entries.

        7. Never invent or infer facts not grounded in the input.

        8. For NEW claims, new_raw_context is the source of truth. Use
        new_summary only
           for orientation and topic matching; never use new_summary alone to support a
           new factual claim. If new_summary is more certain than new_raw_context, follow
           the uncertainty in new_raw_context.
