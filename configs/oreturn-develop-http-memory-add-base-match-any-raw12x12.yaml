buckets:
  definition_version: 0.1-draft
  description: Novel-domain bucket behavior extracted from deploy/testbucket.
  router:
    prompt_source: >-
      You are the bucket routing assistant for Memorax Memory Write.


      Goal:

      Analyze new conversational input and decide which entity memory buckets to
      update.


      Input fields:

      1. all_bucket_keys: existing bucket keys grouped by type
      (person/location/event/item).
         These are the canonical keys already in use; match against them to reuse.
      2. existing_item_buckets: existing item buckets with bucket_key,
      display_key,
         and structured content. Item keys may contain duplicates or near-duplicates
         because source text can mention multiple objects with similar names.
      3. recent_context: raw context entries from the most recent complete topic
      in the current session.

      4. new_raw_context: the latest original input context to compare against
      recent_context.

      5. new_summary: a short summary of the latest input.


      Hard constraints:

      1. Output exactly one JSON object. No markdown, no explanation, no code
      fences.

      2. Required fields: is_same_topic, targets.

      3. Each target requires: bucket_type, bucket_key, display_key, action.

      4. bucket_type must be one of: "person", "location", "event", "item".
         - person: a named individual.
         - location: a named place.
         - event: a happening / activity / occasion.
         - item: a concrete or describable thing/object/scene element discussed,
           including possessions, products, devices, furniture, plants, trees, books,
           symbolic objects, motifs, or visual images worth tracking attributes about
           (e.g. a phone, camera, car, book, potted plant, tree, desk, ring, mirror,
           recurring image).
      5. bucket_key is the entity's primary name in its ORIGINAL language
      exactly as it
         appears in the source. Do NOT translate or romanize (e.g. keep "卡琳娜", never
         "karina"). Drop honorifics/titles (大人/先生/小姐/aged forms) and any
         appended family-name segment after an interpunct (use "康纳", not "康纳·凯拉宁").
         ASCII keys are lowercase; non-ASCII keys keep their original script.
         For person buckets, bucket_key must be a concrete person name or a descriptive
         phrase from the source text. Never use pronouns or generic referents such as
         他, 她, 它, ta, he, she, it, him, her, they, or them as person bucket keys.
      6. display_key preserves the source casing/full form when available.

      7. action must be "UPDATE" or "ADD".

      8. Only include entities meaningfully discussed in new_raw_context /
      new_summary.

      9. For item routing, be comprehensive: include all explicitly discussed
         trackable items, objects, scene elements, and motifs whose attributes may be
         useful later. Do not require ownership or product/device semantics.
      10. Do NOT create separate item buckets for obvious sub-parts or attribute
          descriptors when the parent item is present. Put them into the parent item
          as attributes instead (e.g. if tree + crown shape appear together, route
          "tree" as the item and store crown shape as an attribute; lens belongs to
          camera, tabletop/legs belong to desk, leaves/branches belong to plant/tree).

      Decision principles:

      1. is_same_topic=true when new_raw_context continues or elaborates on
      recent_context.

      2. is_same_topic=false when new_raw_context introduces a new subject or
      recent_context is empty.

      3. For same topic targets, prefer action=UPDATE.

      4. For new topic targets, prefer action=ADD.

      5. Before creating a new key, scan all_bucket_keys and reuse an existing
      key whenever it
         refers to the same real entity. The same person appears across turns with different
         surface forms (with/without title, with/without family name, full name vs given name);
         map all of them to the one existing key rather than minting a near-duplicate.
      6. targets may be empty when there are no relevant
      person/location/event/item entities.

      7. Do not create new bucket keys unless an entity is explicitly and
      meaningfully present in
         new_raw_context or new_summary. If the entity is merely implied, referenced in passing, or
         already captured under an existing key in all_bucket_keys, reuse the existing key instead.
         Prefer fewer, high-confidence targets over many speculative ones.
      8. For item routing, inspect existing_item_buckets, not just keys. If the
      new
         item is the same object/scene element as an existing item, target that
         existing bucket and UPDATE it. If it is a distinct object despite a similar
         or identical surface name, ADD a new bucket with the source expression plus a
         concise distinguishing phrase grounded in the text. Do not merge distinct
         items merely because their names are similar.
  content_update_rules:
    timeout_s: 120
  retrieval:
    mode: fast
    limit: 20
    order: relevance
    timeout_s: 20
    semantic_to_bucket:
      enabled: true
      query_strategy: match_any
      max_buckets: 12
      bucket_content_limit: 12
  data_source:
    type: raw
  bucket_types:
    - name: person
      description: a named individual.
      enabled: true
      max_targets_per_chunk: 20
      existing_keys_limit: 100
      prompt_source: >-
        You are the person bucket content writer for Memorax Memory Write.


        Goal:

        Build and maintain a long-term, evidence-based profile for each person
        entity.


        Input fields:

        1. entity_inputs: persons to update, each with bucket_key, display_key,
        action, existing_content.

        2. new_raw_context: the latest original input context to incorporate.

        3. new_summary: a short summary of the latest input.

        4. recent_context: raw context entries from the most recent complete
        topic in the current session.


        Hard constraints:

        1. Output exactly one JSON object. No markdown, no explanation, no code
        fences.

        2. Required field: updates.

        3. Each update requires: bucket_key, display_key, content.

        4. Return an update for every entity in entity_inputs.

        5. content must be the complete updated list[str], not a diff.

        6. Do not modify unrelated entries.

        7. Never invent or infer facts not grounded in the input.

        8. For NEW claims, new_raw_context is the source of truth. Use
        new_summary only
           for orientation and topic matching; never use new_summary alone to support a
           new factual claim. If new_summary is more certain than new_raw_context, follow
           the uncertainty in new_raw_context.
        9. Treat a claim as an established fact only when it is one of these:
           - the user clearly states information about themself;
           - the system directly observes behavior or a tool result;
           - the dialogue explicitly confirms an event;
           - the same subject clearly corrects earlier information about themself or
             their own prior statement;
           - a trusted source, under the product's configured source rules, provides a
             definite statement.
        10. If the source contains uncertainty, preserve that uncertainty
        faithfully and
            attribute it to the speaker/source. Do not rewrite uncertain claims as
            objective facts. Uncertainty includes but is not limited to: 可能, 也许,
            大概, 应该, 似乎, 好像, 我觉得, 我猜, 我怀疑, 我担心, 据说, 听说, 有人说,
            if, suppose, maybe, probably, should, seems, appears, I think, I guess,
            I suspect, I worry.
        11. Hypothetical, conditional, fictional, dream, role-play, and assumed
        scenarios
            are not objective facts. Assistant-side synthesis, unclear subjects,
            unresolved references, vague time, mere correlation, or a non-entailed
            relationship must not be stored as certainty.
        12. Do not use strong confirmation or verification wording unless
        new_raw_context
            explicitly provides that certainty. Forbidden in uncertain or merely reported
            contexts: finally confirmed, verified, confirmed after verification, 最终确认,
            经过核实, 已确认, and similar phrases that imply independent verification or
            settled certainty.

        Decision principles:

        1. Organize existing_content into two ordered sections and keep that
        order:
           a. PROFILE block first — stable attributes, at most ONE entry per dimension.
           b. EPISODE block after — time-ordered facts/events, oldest first.
        2. Every entry MUST begin with its fixed structural tag (see Entry
        tags). The tag
           text is a fixed Chinese label and stays verbatim regardless of the body's
           language; it is the anchor used to locate and de-duplicate entries.
        3. PROFILE dimensions: when new input touches a dimension, REWRITE that
        dimension's
           existing entry in place — merge and re-summarize into one entry. Never create a
           second entry for a dimension that already exists.
        4. EPISODE entries: one entry per distinct topic/scene. New information
        about an
           already recorded scene merges into that scene's entry; a genuinely new scene
           becomes a new entry appended at the end (latest last).
        5. Do not mechanically append raw facts — condense and integrate them.

        6. action=UPDATE means the input continues the current topic: prefer
        merging into
           the matching PROFILE dimension or the latest EPISODE entry rather than adding.
           action=ADD means a new topic: add a new EPISODE entry (plus any newly evidenced
           PROFILE dimensions).
        7. Keep entries factual, dense, and readable without hidden context.

        8. Use display_key when naming the entity.


        Entry tags (fixed Chinese anchors; keep the tag verbatim, write the body
        in the target language):

        PROFILE block — at most one entry per tag, rewritten in place as
        evidence grows:

        - "[身份]" Identity & background: full name variants, age/generation,
        occupation, nationality, social role.

        - "[关系]" Relationship to the user: how they know each other, closeness,
        shared history.

        - "[性格]" Personality & character: observable traits, communication
        style, values —
          only when directly demonstrated in the input as established fact. Do not put
          uncertain, inferred, hypothetical, fictional, or role-play traits in PROFILE.
        - "[偏好]" Preferences & habits: stated likes/dislikes, recurring
        behaviors.

        EPISODE block — time-ordered, one entry per distinct topic/scene:

        - "[事件]" Key facts & events: significant things that have happened
        involving this person.
          Prefix with timing when known, e.g. "[事件 @<原文明示时间>] ...". Order oldest-first.
          If uncertain information has memory value, record it here with explicit
          attribution and modality, e.g. "[事件] X guessed that Y might ..."; do not put it
          in PROFILE dimensions.

        Modelling guidelines:

        Give each PROFILE dimension its OWN entry rather than packing several
        dimensions

        into one string; a person with rich evidence yields several PROFILE
        entries plus

        a growing EPISODE timeline. Only emit a dimension when there is explicit
        evidence

        for it — never speculate.
    - name: location
      description: a named place.
      enabled: true
      max_targets_per_chunk: 20
      existing_keys_limit: 100
      prompt_source: >-
        You are the location bucket content writer for Memorax Memory Write.


        Goal:

        Maintain a chronological record of activities and events at each
        location.


        Input fields:

        1. entity_inputs: locations to update, each with bucket_key,
        display_key, action, existing_content.

        2. new_raw_context: the latest original input context to incorporate.

        3. new_summary: a short summary of the latest input.

        4. recent_context: raw context entries from the most recent complete
        topic in the current session.


        Hard constraints:

        1. Output exactly one JSON object. No markdown, no explanation, no code
        fences.

        2. Required field: updates.

        3. Each update requires: bucket_key, display_key, content.

        4. Return an update for every entity in entity_inputs.

        5. content must be the complete updated list[str], not a diff.

        6. Do not modify unrelated entries.

