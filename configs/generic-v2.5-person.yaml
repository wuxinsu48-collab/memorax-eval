      逐条确认主体、对象、来源和适用范围。真实用户明确自述的事实可按自述来源保存；不是一出现“说、记得、昨天”就降为不确定陈述。传闻、猜测、争议说法保留来源和不确定性，不升级为客观结论。材料叙述、材料人物台词和真实用户分别判断；消息角色user/assistant不替代材料人物。
      从已有内容保留全部有据事实，再合并本次信息。未再次提及不表示失效，不能用最新消息重写整桶或因为Raw另有原文就删除本桶负责的事实。
      在同一主体、具体属性或动作、同一适用范围内判断：自然变化把被替代的旧现状标（历史，适用阶段或替代关系），有据新现状标（当前，适用范围）；明确纠错才标旧断言（已撤销，纠错依据），正确值写回相应类别或属性并使用该值自身有据的适用阶段，只有来源明确适用于旧阶段才回填，旧阶段正确值未知则不补，不能只放在更正说明或撤销理由里；兼任、补充及不同范围可并存。普通现状更新按输入先后承接，但原文明确指向过去或未来时使用该范围，不能把历史纠错写成新当前状态。时间未给出不编日历日期，可使用有依据的相对先后。
      当前、历史和已撤销是事实效力，写在对应类别的条目或value中，不新建历史类别。明确纠正此前误撤销时，只恢复被指明命题的有据效力，不同时保留相反的撤销结论。完成、取消和错误撤销分别表达。真实发生过的动作、当时成立的状态和原话记录，不因后来变化而作废。
      只调整受影响命题，并检查本目标已提供内容中同一命题的所有副本；其余属性、阶段、条件、数量和来源保留。不假定能修改没有提供的其他桶。输出前逐项核对旧事实去向和新事实依据，不输出核对过程。

      【范围与字段】
      事项可跨多次活动推进；同一事项后续阶段继续维护，不能仅因同人物、同地点或同物品就合并不同事项。不为普通聊天请求虚构事项。
      [范围]保存事情身份、对象和边界；动态责任与进度不要写成永久身份。已有范围中的责任有变化时也须调整其效力，不能只改条件。
      [时间或阶段]保留有据时间；[背景]保存理解事项所需的背景及适用阶段。
      [条件]保存要求、建议、计划、约定、责任和先决条件，注明提出者、接受情况及范围。
      [过程]保存已经发生的关键步骤、交流中的实际接受或拒绝、执行者、对象、数量和顺序；接受执行责任不等于已执行责任内容。
      [结果]保存原文明示的阶段结果及当前进度，不以活动数量推断整件事完成。
      [陈述]保存需注明来源或存在争议的说法；[更正]保存纠错关系并修正原类别中的错误断言；[未发生]只保存有明确范围的否定，不以缺少后续推失败。

      【建议、约定、动作与结果】
      对已经明确的事项，保留与事项直接相关的具体建议、步骤清单及用户回应。建议的顺序与各步骤不能因后来执行了某一步就被改写或遗漏。
      建议不等于接受，接受不等于执行，完成一步不等于全事项完成。未表明接受的方案注明“建议，采纳未说明”，不能放入已执行[过程]。
      邀请或条件、回应和实际后续相互对应，保留必要触发关系；不能只剩动作而丢掉“在什么条件下同意”。
      每个动作重新确认执行者和受事；人物在场不等于实施。真实用户明确报告的进展可按自述来源保存，不因使用“我说/我记得”机械排除；不确定回忆及材料内争议说法不擅自裁定。
      事项只存有据关系，不补未说明的原因、结果、时间和累计。表格、报表及清单中的事实逐项保留主体、期间、单位、范围和否定，不能以主题概况替代数值。

      【进展更新与多副本】
      本次明确的条件变动、责任撤回、部分完成、全部完成、取消和恢复均更新同一事项对应字段。不能把新进度只写成[陈述]或人物经历而让原事项保持相反的当前状态。
      同一事项内逐条检查[范围]/[背景]/[条件]/[结果]/[未发生]中的受影响动态断言；只处理变化的命题，不一律撤销整件事或全部背景。
      已完成的责任标已完成，取消的责任标已取消，原来写错才标已撤销。原计划和真实过程仍保留；部分取消不否定已完成部分，并行责任与独立条件不因本次未提而删除。
      仅将本次已被替代、履行或取消的条件及进度标为相应历史状态，仍适用的独立条件继续有效；有据新进度明确当前。历史方案仍按方案保留，事项完成不证明原方案各项均按原值执行，实际执行另记。原句引用不改内容，效力说明写在引用外。历史更正仍属于原阶段，不能覆盖后来的进度。
      对旧内容中的有序建议、真实步骤、阶段结果分别保留，不把“建议清单第几步”和“已完成第几步”揉成同一条无性质的过程。

      【操作示例，占位内容不是本次事实】
      建议先检查对象甲、再标记对象乙、最后整理对象丙，用户只报告对象甲检查完毕：保留完整三步建议及原顺序，仅检查甲进入实际过程，乙丙不能写成已执行，也不能省掉其建议记录。
      原事项待举行、人物乙负责接待，且人物甲已完成准备；后来事项取消、乙不再负责：旧待举行及接待职责标历史并记录取消，范围/背景里相同的现行职责也要调整；人物甲的真实准备动作继续保留。
      原范围包含两部分交付，先完成甲后完成乙：保留两阶段过程和曾未完成乙的阶段状态，当前结果更新为两部分均完成，不能只剩最后交付乙。

      严格JSON只有updates，每个指定key恰好一次并沿用key/display_key；content为完整非空字符串数组，不是本次摘要。仅用本桶定义的前缀，效力写在对应条目内，不自造结构、diff、解释或占位。
      无本事项新增信息的UPDATE保留已有内容；不能为ADD编造事项。输出前复核旧条件、过程、阶段和未涉及事实的保留，以及当前结果与所有已提供副本是否一致。
      {{target_output_language_rule}}
